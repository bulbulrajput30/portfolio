<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>JavaScript Day 3 - Async JavaScript</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        .task {
            background: white;
            padding: 20px;
            margin: 20px auto;
            max-width: 700px;
            border: 1px solid #ccc;
            border-radius: 10px;
        }

        h2 {
            color: #222;
        }

        p {
            line-height: 1.6;
        }
    </style>
</head>

<body>

    <h1>JavaScript Day 3 - Async JavaScript</h1>

    <!-- TASK 1 -->
    <div class="task">
        <h2>Task 1 - Simulate API Call</h2>
        <div id="task1"></div>
    </div>


    <!-- TASK 2 -->
    <div class="task">
        <h2>Task 2 - Promise Example</h2>
        <div id="task2"></div>
    </div>


    <!-- TASK 3 -->
    <div class="task">
        <h2>Task 3 - Async/Await with Fetch</h2>
        <div id="task3"></div>
    </div>


    <!-- MINI CHALLENGE -->
    <div class="task">
        <h2>Mini Challenge - Weather Fetcher</h2>
        <div id="weather"></div>
    </div>


    <script>

        // =========================================
        // TASK 1 - Simulate API Call with setTimeout
        // =========================================

        const task1 = document.getElementById("task1");

        function fakeAPICall() {

            task1.innerHTML +=
                "<p>Fetching user details...</p>";

            setTimeout(() => {

                task1.innerHTML +=
                    "<p>User data received</p>";

                // Extension: another timeout
                setTimeout(() => {

                    task1.innerHTML +=
                        "<p>Processing Data...</p>";

                }, 2000);

            }, 2000);
        }

        fakeAPICall();


        // =========================================
        // TASK 2 - Promise Example
        // =========================================

        const task2 = document.getElementById("task2");

        const simulateFetch = new Promise(
            (resolve, reject) => {

                let isOnline = true;

                setTimeout(() => {

                    if (isOnline) {
                        resolve(
                            "Data fetched successfully"
                        );
                    } else {
                        reject(
                            "Network error"
                        );
                    }

                }, 1500);
            }
        );


        simulateFetch
            .then(message => {

                task2.innerHTML =
                    `<p>${message}</p>`;

            })
            .catch(error => {

                task2.innerHTML =
                    `<p>Error: ${error}</p>`;

            });


        // =========================================
        // TASK 3 - Async/Await with Fetch
        // =========================================

        const task3 = document.getElementById("task3");

        async function loadPosts() {

            task3.innerHTML =
                "<p>Loading posts...</p>";

            try {

                const response = await fetch(
                    "https://jsonplaceholder.typicode.com/posts?_limit=5"
                );

                const posts = await response.json();

                task3.innerHTML =
                    "<p><b>Latest Posts:</b></p>";

                posts.forEach(post => {

                    task3.innerHTML += `
                        <p>
                            <b>${post.id}. ${post.title}</b>
                        </p>
                    `;

                });

            } catch (error) {

                task3.innerHTML =
                    "<p>Error loading posts.</p>";

            }
        }

        loadPosts();


        // =========================================
        // MINI CHALLENGE - Weather Fetcher
        // =========================================

        const weather = document.getElementById("weather");

        async function getWeather() {

            weather.innerHTML =
                "<p>Fetching weather...</p>";

            try {

                const response = await fetch(
                    "https://api.open-meteo.com/v1/forecast?latitude=28.61&longitude=77.23&current_weather=true"
                );

                const data = await response.json();

                const temperature =
                    data.current_weather.temperature;

                const windSpeed =
                    data.current_weather.windspeed;

                weather.innerHTML = `
                    <p>
                        <b>Current Temp:</b>
                        ${temperature}°C
                    </p>

                    <p>
                        <b>Wind Speed:</b>
                        ${windSpeed} km/h
                    </p>
                `;

            } catch (error) {

                weather.innerHTML =
                    "<p>Unable to fetch weather data.</p>";

            }
        }

        getWeather();

    </script>

</body>

</html>
