<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Day 4 - Random User API</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
        }

        h1 {
            text-align: center;
            margin-bottom: 35px;
        }

        .section {
            background: white;
            padding: 25px;
            margin: 30px auto;
            max-width: 1100px;
            border: 1px solid #ccc;
            border-radius: 12px;
        }

        .section h2 {
            text-align: center;
            margin-top: 0;
        }

        button {
            display: block;
            margin: 20px auto;
            padding: 11px 22px;
            background: black;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #333;
        }

        /* User Card */
        .user-card {
            background: white;
            border: 1px solid #ccc;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 8px #ddd;
        }

        .user-card img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
        }

        .user-card h3 {
            margin: 12px 0 8px;
        }

        .user-card p {
            word-break: break-word;
            font-size: 14px;
        }

        /* Task 1 */
        #singleUser {
            max-width: 350px;
            margin: auto;
        }

        /* Task 2 & Mini Challenge */
        .users-grid {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(210px, 1fr)
            );
            gap: 20px;
        }
    </style>
</head>

<body>

    <h1>Day 4 - Random User API</h1>


    <!-- ================= TASK 1 ================= -->

    <div class="section">

        <h2>Task 1 - Random User Card</h2>

        <div id="singleUser">
            Loading user...
        </div>

        <button onclick="loadSingleUser()">
            Get New User
        </button>

    </div>


    <!-- ================= TASK 2 ================= -->

    <div class="section">

        <h2>Task 2 - Multiple Users</h2>

        <button onclick="loadMultipleUsers()">
            Load 5 Users
        </button>

        <div
            id="multipleUsers"
            class="users-grid">
        </div>

    </div>


    <!-- ================= MINI CHALLENGE ================= -->

    <div class="section">

        <h2>Mini Challenge - User Directory</h2>

        <button onclick="loadDirectoryUsers()">
            Refresh Users
        </button>

        <div
            id="directoryUsers"
            class="users-grid">
        </div>

    </div>


    <script>

        // =========================================
        // TASK 1 - RANDOM USER CARD
        // =========================================

        async function loadSingleUser() {

            const singleUser =
                document.getElementById("singleUser");

            singleUser.innerHTML =
                "Loading user...";

            try {

                const response =
                    await fetch(
                        "https://randomuser.me/api"
                    );

                const data =
                    await response.json();

                const user =
                    data.results[0];

                const fullName =
                    user.name.first + " " +
                    user.name.last;

                singleUser.innerHTML = `

                    <div class="user-card">

                        <img
                            src="${user.picture.large}"
                            alt="Profile Picture"
                        >

                        <h3>${fullName}</h3>

                        <p>${user.email}</p>

                    </div>

                `;

            } catch (error) {

                singleUser.innerHTML =
                    "Unable to load user.";

            }
        }


        // =========================================
        // TASK 2 - MULTIPLE USERS
        // =========================================

        async function loadMultipleUsers() {

            const multipleUsers =
                document.getElementById(
                    "multipleUsers"
                );

            multipleUsers.innerHTML =
                "Loading users...";

            try {

                const response =
                    await fetch(
                        "https://randomuser.me/api/?results=5"
                    );

                const data =
                    await response.json();

                multipleUsers.innerHTML = "";

                data.results.forEach(user => {

                    const fullName =
                        user.name.first + " " +
                        user.name.last;

                    multipleUsers.innerHTML += `

                        <div class="user-card">

                            <img
                                src="${user.picture.large}"
                                alt="Profile Picture"
                            >

                            <h3>${fullName}</h3>

                            <p>${user.email}</p>

                        </div>

                    `;

                });

            } catch (error) {

                multipleUsers.innerHTML =
                    "Unable to load users.";

            }
        }


        // =========================================
        // MINI CHALLENGE - USER DIRECTORY
        // =========================================

        async function loadDirectoryUsers() {

            const directoryUsers =
                document.getElementById(
                    "directoryUsers"
                );

            directoryUsers.innerHTML =
                "Loading users...";

            try {

                const response =
                    await fetch(
                        "https://randomuser.me/api/?results=5"
                    );

                const data =
                    await response.json();

                directoryUsers.innerHTML = "";

                data.results.forEach(user => {

                    const fullName =
                        user.name.first + " " +
                        user.name.last;

                    directoryUsers.innerHTML += `

                        <div class="user-card">

                            <img
                                src="${user.picture.large}"
                                alt="Profile Picture"
                            >

                            <h3>${fullName}</h3>

                            <p>${user.email}</p>

                        </div>

                    `;

                });

            } catch (error) {

                directoryUsers.innerHTML =
                    "Unable to load users.";

            }
        }


        // Page open hone par Task 1 aur
        // Mini Challenge ke users load honge

        loadSingleUser();
        loadDirectoryUsers();

    </script>

</body>

</html>
